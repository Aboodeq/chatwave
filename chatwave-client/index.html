<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ChatWave: private conversations for your team." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1117" media="(prefers-color-scheme: dark)" />
    <title>ChatWave</title>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("chatwave-ui") || "{}");
          var theme = (saved.state && saved.state.theme) || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
