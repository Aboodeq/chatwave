<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ChatWave: private conversations for your team." />
    <meta name="theme-color" content="#ffffff" />
    <title>ChatWave</title>
    <script>
      // Apply the language (and its direction) before first paint, so Arabic doesn't flash
      // left to right. Same order as detectLanguage() in src/i18n/languages.ts.
      (function () {
        try {
          var valid = function (value) {
            return value === "ar" || value === "en";
          };
          var saved = localStorage.getItem("chatwave-language");
          var account = localStorage.getItem("chatwave-account-language");
          var language = valid(saved) ? saved : valid(account) ? account : /^ar/i.test(navigator.language || "") ? "ar" : "en";
          document.documentElement.lang = language;
          document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
      // Apply the saved theme before first paint (light unless the user chose otherwise).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("chatwave-ui") || "{}");
          var theme = (saved.state && saved.state.theme) || "light";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
